<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FF6B6B" stroke="#FF5252" strokeWidth="2"/>
  
  <!-- Outer octagon -->
  <polygon points="100,20 160,40 180,100 160,160 100,180 40,160 20,100 40,40" fill="none" stroke="#FF5252" strokeWidth="2"/>
  
  <!-- Inner circle with gradient effect -->
  <circle cx="100" cy="100" r="60" fill="#FFE66D" opacity="0.9"/>
  
  <!-- Dumbbell icon -->
  <g transform="translate(100, 100)">
    <!-- Left weight -->
    <circle cx="-30" cy="0" r="12" fill="#FF5252"/>
    <!-- Bar -->
    <rect x="-18" y="-6" width="36" height="12" fill="#4ECDC4" rx="3"/>
    <!-- Right weight -->
    <circle cx="30" cy="0" r="12" fill="#FF5252"/>
    
    <!-- Center accent -->
    <rect x="-6" y="-8" width="12" height="16" fill="#2D3E50" rx="2"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#2D3E50" fontFamily="Arial">
    OctoFit
  </text>
</svg>